name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  shellcheck:
    name: shellcheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run shellcheck
        run: |
          # Only lint bash scripts. zsh rc files (linked/zshrc etc.) use
          # zsh-specific syntax shellcheck can't fully parse.
          shellcheck -x -S warning setup install/*.sh linked/bin/* raycast/scripts/.lib.sh raycast/scripts/*.sh

  zsh-syntax:
    name: zsh syntax
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install zsh
        run: sudo apt-get update -qq && sudo apt-get install -y zsh
      - name: Check zsh configuration
        run: |
          for file in linked/zshrc linked/zshenv linked/zprofile shell/env shell/aliases; do
            zsh -n "$file"
          done

  shfmt:
    name: shfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install shfmt
        run: |
          go install mvdan.cc/sh/v3/cmd/shfmt@latest
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - name: Check formatting
        run: shfmt -d -i 2 -ci setup install/*.sh linked/bin/* raycast/scripts/.lib.sh raycast/scripts/*.sh

  doctor:
    name: doctor (docs ↔ Brewfile)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run doctor
        env:
          DOTFILES_DIR: ${{ github.workspace }}
        run: ./linked/bin/dotctl doctor

  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
