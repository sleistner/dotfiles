onboarding = false
[ui]
sidebar_width = 40
sidebar_max_width = 50

# >>> herdr-radar tab-bar block
tab_bar_right_separator = " · "
tab_bar_right = [
  { type = 'command', command = 'cat "/Users/sleistner/.local/state/herdr/plugins/hhdebb.herdr-radar/tabbar.txt"', interval_seconds = 6, timeout_seconds = 2 },
]
# <<< herdr-radar tab-bar block

agent_panel_sort = "spaces"

status_indicators = "symbols"
[ui.toast]
delivery = "terminal"

[theme]
name = "catppuccin"
auto_switch = false

light_name = "gruvbox-light"
dark_name = "gruvbox"
[ui.sound]
enabled = false

# >>> herdr-radar theme block
[theme.custom]
active_row_bg = "#4a3a72"
# <<< herdr-radar theme block

[[keys.command]]
key = "prefix+a"
type = "plugin_action"
command = "hhdebb.herdr-radar.view-flip"

[[keys.command]]
key = "prefix+comma"
type = "plugin_action"
command = "hhdebb.herdr-radar.settings"

# >>> herdr-radar sidebar block
[ui.sidebar.agents]
